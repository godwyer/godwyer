<!DOCTYPE html>
<html>
<head>
  <title>Central PA Cities Map</title>

  <!-- Include Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

</head>
<body>

  <!-- Create the map div -->
  <div id="map" style="width: 800px; height: 500px;"></div>

  <!-- Include Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

  <script>

    // Map center and zoom level
    var map = L.map('map').setView([40.5, -77], 7);

    // Tile layer 
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
	attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
	subdomains: 'abcd',
	maxZoom: 20
}).addTo(map);

    // City data
    var Hburg = {
      name: 'Harrisburg', 
      lat: 40.2732,
      lng: -76.88,
      population: 50649
    }
    
    var Lanc = {
      name: 'Lancaster',  
      lat: 40.0403,
      lng: -76.3042,
      population: 58441
    };

     // Add circles
       L.circle([Hburg.lat, Hburg.lng], {
        radius: Math.sqrt(Hburg.population) * 100,
        color: 'gold',
        fillColor: 'blue',
        weight: 6
        
        }).addTo(map);
    
        L.tooltip()
  .setLatLng([Hburg.lat, Hburg.lng])
  .setContent("<b>Name: </b><i>" + Hburg.name + "</i><br><b>Population: </b><i>" + Hburg.population + "</i>")
  .addTo(map);
    
      
     L.circle([Lanc.lat, Lanc.lng], {
        radius: Math.sqrt(Lanc.population) * 100,
        color: 'red',
        fillColor: 'blue',
        weight: 6
        
        }).addTo(map);

        L.tooltip()
  .setLatLng([Lanc.lat, Lanc.lng])
  .setContent("<b>Name: </b><i>" + Lanc.name + "</i><br><b>Population: </b><i>" + Lanc.population + "</i>")
  .addTo(map);
    
    
  </script>

</body>
</html>
