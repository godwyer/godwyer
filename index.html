<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIS Portfolio | Garrett O'Dwyer</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
}

.hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;    
}

.hero h1 {
    font-size: 3rem;
    margin-bottom: 10px;
}

.hero p {
    max-width: 600px;
    opacity: 0.85;
}

.btn {
    margin-top: 30px;
    padding: 12px 24px;
    background: #38bdf8;
    color: black;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
    transition: 0.3s;
}

.btn:hover {
    background: #0ea5e9;
}

.section {
    padding: 60px 20px;
    text-align: center;
}

.skills {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
}

.skill {
    background: #1e293b;
    padding: 10px 18px;
    border-radius: 20px;
    border: 1px solid #38bdf8;
}
</style>

</head>

<body>

<div class="hero">
    <h1>GIS Portfolio</h1>
    <p>This semester I developed skills in web mapping, geospatial analysis, and interactive data visualization using tools like Leaflet, GeoJSON, and ArcGIS Pro.</p>
    <a href="portfolio.html" class="btn">View My Work</a>
</div>

<div class="section">
    <h2>What I Learned</h2>
    <div class="skills">
        <div class="skill">Leaflet.js</div>
        <div class="skill">GeoJSON</div>
        <div class="skill">ArcGIS Pro</div>
        <div class="skill">Spatial Analysis</div>
        <div class="skill">Data Visualization</div>
        <div class="skill">Web Mapping</div>
    </div>
</div>
