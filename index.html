<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIS Portfolio</title>

<style>
* {margin:0; padding:0; box-sizing:border-box;}

body {
    font-family: 'Segoe UI', sans-serif;
    background: black;
    color: white;
    overflow-x: hidden;
}

/* Animated gradient background */
.bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: linear-gradient(-45deg, #0ea5e9, #9333ea, #22c55e, #f59e0b);
    background-size: 400% 400%;
    animation: gradient 15s ease infinite;
    z-index: -2;
}

@keyframes gradient {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* Overlay dark glass */
.overlay {
    position: fixed;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    z-index:-1;
}

/* Floating particles */
.particle {
    position:absolute;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    opacity:0.5;
    animation: float 10s infinite linear;
}

@keyframes float {
    from {transform: translateY(100vh);}
    to {transform: translateY(-10vh);}
}

/* Hero */
.hero {
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero h1 {
    font-size:4rem;
    letter-spacing:2px;
}

.hero p {
    max-width:600px;
    margin-top:20px;
    opacity:0.85;
}

/* Animated button */
.btn {
    margin-top:40px;
    padding:15px 30px;
    background:transparent;
    border:2px solid #38bdf8;
    color:#38bdf8;
    font-weight:bold;
    text-decoration:none;
    position:relative;
    overflow:hidden;
}

.btn:before {
    content:'';
    position:absolute;
    width:100%;
    height:100%;
    background:#38bdf8;
    left:-100%;
    top:0;
    transition:0.4s;
    z-index:-1;
}

.btn:hover:before {
    left:0;
}

.btn:hover {
    color:black;
}

/* Scroll section */
.section {
    padding:80px 20px;
    text-align:center;
}

.skills {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
}

.skill {
    padding:12px 20px;
    border:1px solid white;
    border-radius:30px;
    transition:0.3s;
}

.skill:hover {
    background:white;
    color:black;
    transform:scale(1.1);
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<!-- floating particles -->
<script>
for(let i=0;i<40;i++){
    let p=document.createElement("div");
    p.className="particle";
    p.style.left=Math.random()*100+"%";
    p.style.animationDuration=(5+Math.random()*10)+"s";
    document.body.appendChild(p);
}
</script>

<div class="hero">
    <h1>GIS Portfolio</h1>
    <p>This semester I built interactive maps, spatial analysis tools, and data visualizations using modern web mapping technologies.</p>
    <a href="portfolio.html" class="btn">Enter Portfolio</a>
</div>

<div class="section">
    <h2>Skills & Tools</h2>
    <div class="skills">
        <div class="skill">Leaflet</div>
        <div class="skill">GeoJSON</div>
        <div class="skill">ArcGIS Pro</div>
        <div class="skill">Spatial Analysis</div>
        <div class="skill">Data Visualization</div>
        <div class="skill">Web Mapping</div>
    </div>
</div>

</body>
</html>
