<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIS Portfolio</title>

<style>
* {margin:0; padding:0; box-sizing:border-box;}

body {
    font-family: 'Segoe UI', sans-serif;
    background:black;
    color:white;
    overflow-x:hidden;
}

/* ===== BACKGROUND ===== */
.bg {
    position:fixed;
    width:100%;
    height:100%;
    background:linear-gradient(-45deg,#0ea5e9,#9333ea,#22c55e,#f59e0b);
    background-size:400% 400%;
    animation:gradient 15s ease infinite;
    z-index:-2;
}

@keyframes gradient {
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.overlay {
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.65);
    backdrop-filter:blur(10px);
    z-index:-1;
}

/* ===== HERO ===== */
.hero {
    height:70vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero h1 {
    font-size:4rem;
}

.hero p {
    max-width:600px;
    margin-top:20px;
    opacity:0.85;
}

/* ===== BUTTON ===== */
.btn {
    margin-top:30px;
    padding:14px 28px;
    border:2px solid #38bdf8;
    color:#38bdf8;
    text-decoration:none;
    position:relative;
    overflow:hidden;
}

.btn:before {
    content:'';
    position:absolute;
    width:100%;
    height:100%;
    background:#38bdf8;
    left:-100%;
    transition:0.4s;
    z-index:-1;
}
.btn:hover:before {left:0;}
.btn:hover {color:black;}

/* ===== CIRCLE SYSTEM ===== */
.circle-container {
    display:flex;
    justify-content:center;
    align-items:center;
    margin:40px 0;
    perspective:1000px;
}

.circle {
    width:260px;
    height:260px;
    position:relative;
    cursor:pointer;
    transition:transform 0.2s ease;
}

/* SVG ring */
svg {
    position:absolute;
    width:100%;
    height:100%;
}

/* rotating rings */
.outer {
    animation:spin 20s linear infinite;
}
.inner {
    animation:spinReverse 12s linear infinite;
}

/* compass ticks */
.ticks {
    stroke:#38bdf8;
    stroke-width:1;
    opacity:0.6;
}

/* pulse core */
.core {
    position:absolute;
    top:50%;
    left:50%;
    width:30px;
    height:30px;
    background:#22c55e;
    border-radius:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 20px #22c55e;
    animation:pulse 2s infinite;
}

/* ripple */
.ripple {
    position:absolute;
    top:50%;
    left:50%;
    width:40px;
    height:40px;
    border:2px solid #22c55e;
    border-radius:50%;
    transform:translate(-50%,-50%);
    animation:ripple 2s infinite;
}

/* coordinate text */
.coords {
    position:absolute;
    bottom:-30px;
    width:100%;
    text-align:center;
    font-size:0.8rem;
    opacity:0.7;
}

/* animations */
@keyframes spin {
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}
@keyframes spinReverse {
    from{transform:rotate(360deg);}
    to{transform:rotate(0deg);}
}
@keyframes pulse {
    0%,100%{transform:translate(-50%,-50%) scale(1);}
    50%{transform:translate(-50%,-50%) scale(1.4);}
}
@keyframes ripple {
    0%{opacity:1; transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0; transform:translate(-50%,-50%) scale(3);}
}

/* ===== SKILLS ===== */
.section {
    padding:60px;
    text-align:center;
}

.skills {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
}

.skill {
    padding:10px 18px;
    border:1px solid white;
    border-radius:30px;
    transition:0.3s;
}
.skill:hover {
    background:white;
    color:black;
    transform:scale(1.1);
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="hero">
    <h1>GIS Portfolio</h1>
    <p>Interactive mapping, spatial analysis, and data visualization built this semester using modern geospatial tools.</p>
    <a href="portfolio.html" class="btn">Enter Portfolio</a>
</div>

<!-- ===== SUPER CIRCLE ===== -->
<div class="circle-container">
<a href="https://www.latlong.net/" target="_blank">
<div class="circle" id="circle">

<!-- SVG text ring -->
<svg class="outer">
<defs>
<path id="textPath" d="M130,130 m-100,0 a100,100 0 1,1 200,0 a100,100 0 1,1 -200,0"/>
</defs>
<text fill="#38bdf8" font-size="12">
<textPath href="#textPath">
FIND YOUR LATITUDE || LONGITUDE • FIND YOUR LATITUDE || LONGITUDE •
</textPath>
</text>
</svg>

<!-- inner rotating compass -->
<svg class="inner">
<circle cx="130" cy="130" r="60" fill="none" stroke="#22c55e"/>
<line x1="130" y1="70" x2="130" y2="190" class="ticks"/>
<line x1="70" y1="130" x2="190" y2="130" class="ticks"/>
</svg>

<div class="core"></div>
<div class="ripple"></div>

<div class="coords" id="coords">Lat: -- | Long: --</div>

</div>
</a>
</div>

<!-- SKILLS -->
<div class="section">
<h2>Skills & Tools</h2>
<div class="skills">
<div class="skill">Leaflet</div>
<div class="skill">GeoJSON</div>
<div class="skill">ArcGIS Pro</div>
<div class="skill">Spatial Analysis</div>
<div class="skill">Data Visualization</div>
<div class="skill">Web Mapping</div>
</div>
</div>

<script>
const circle = document.getElementById("circle");
const coords = document.getElementById("coords");

/* mouse tilt */
circle.addEventListener("mousemove", (e)=>{
    const rect = circle.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;

    let rotateX = -(y - rect.height/2)/10;
    let rotateY = (x - rect.width/2)/10;

    circle.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
});

/* reset */
circle.addEventListener("mouseleave", ()=>{
    circle.style.transform = "rotateX(0) rotateY(0)";
});

/* fake coordinate generator */
circle.addEventListener("mousemove", ()=>{
    let lat = (Math.random()*180-90).toFixed(3);
    let long = (Math.random()*360-180).toFixed(3);
    coords.innerText = `Lat: ${lat} | Long: ${long}`;
});
</script>

</body>
</html>
