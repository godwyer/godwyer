<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semester Portfolio | Splash</title>
    <style>
        /* CSS is now INSIDE the HTML so it cannot fail to load */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body {
            background-color: #020617; /* Deep dark blue */
            color: #f1f5f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            display: flex;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .left { padding: 60px; flex: 1.2; border-right: 1px solid rgba(255, 255, 255, 0.1); }
        .right { padding: 60px; flex: 0.8; background: rgba(0, 0, 0, 0.2); }

        h1 { font-size: 3.5rem; line-height: 1.1; margin-bottom: 20px; }
        .blue { color: #38bdf8; }
        p { color: #94a3b8; line-height: 1.6; margin-bottom: 30px; }

        .btn {
            display: inline-block;
            background: #38bdf8;
            color: #020617;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover { background: #7dd3fc; transform: translateY(-2px); }

        .tag {
            display: inline-block;
            padding: 6px 12px;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            border-radius: 6px;
            margin: 0 8px 10px 0;
            font-size: 0.8rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        /* Animated background blob */
        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, rgba(2, 6, 23, 0) 70%);
            top: -100px;
            right: -100px;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .hero { flex-direction: column; }
            .left { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); }
        }
    </style>
</head>
<body>
    <div class="blob"></div>
    <section class="hero">
        <div class="left">
            <h1>Mapping <br><span class="blue">Innovation</span></h1>
            <p>A comprehensive showcase of spatial data science and interactive web mapping achieved this semester.</p>
            <a href="projects.html" class="btn">Enter Gallery →</a>
        </div>
        <div class="right">
            <h3 style="margin-bottom:15px; font-size: 0.9rem; text-transform: uppercase; color: #64748b;">Key Skills</h3>
            <div class="tag">ArcGIS API</div>
            <div class="tag">GeoJSON Filtering</div>
            <div class="tag">UI/UX Design</div>
            <div class="tag">JavaScript</div>
            <div class="tag">Spatial Analysis</div>
        </div>
    </section>
</body>
</html>
