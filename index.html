<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIS Portfolio</title>

<style>
* {margin:0; padding:0; box-sizing:border-box;}

body {
    font-family:'Segoe UI', sans-serif;
    background:black;
    color:white;
    overflow-x:hidden;
}

/* BACKGROUND */
.bg {
    position:fixed;
    width:100%;
    height:100%;
    background:linear-gradient(-45deg,#0ea5e9,#9333ea,#22c55e,#f59e0b);
    background-size:400% 400%;
    animation:gradient 15s ease infinite;
    z-index:-2;
}

@keyframes gradient {
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.overlay {
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.65);
    backdrop-filter:blur(10px);
    z-index:-1;
}

/* MAIN LAYOUT - Vertical Balance */
.main {
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content: space-between;
    align-items:center;
    padding: 60px 20px;
}

/* HERO */
.hero { text-align:center; z-index: 10; }
.hero h1 { font-size:3.5rem; }
.hero p { max-width:600px; margin: 15px auto 25px auto; opacity:0.85; }

/* BUTTON */
.btn {
    display: inline-block;
    padding:12px 26px;
    border:2px solid #38bdf8;
    color:#38bdf8;
    text-decoration:none;
    position:relative;
    overflow: hidden;
    z-index: 1;
    transition: 0.4s;
    font-weight: bold;
}
.btn:before {
    content:''; position:absolute; width:100%; height:100%;
    background:#38bdf8; top: 0; left:-100%; transition:0.4s; z-index:-1;
}
.btn:hover:before {left:0;}
.btn:hover {color:black;}

/* CIRCLE CONTAINER */
.circle-container {
    flex-grow: 1;
    display:flex;
    justify-content:center;
    align-items:center;
    margin: 30px 0;
}

/* GRAPHIC LINK WRAPPER */
.graphic-link {
    text-decoration: none;
    cursor: crosshair;
    display: block;
    z-index: 5;
}

.circle {
    width:260px;
    height:260px;
    position:relative;
    transition:transform 0.2s ease;
    transform-style: preserve-3d;
}

/* SVG rings */
svg { position:absolute; width:100%; height:100%; pointer-events: none;}
.outer { animation:spin 20s linear infinite; }
.inner { animation:spinReverse 12s linear infinite; }

/* Core elements */
.core {
    position:absolute; top:50%; left:50%; width:30px; height:30px;
    background:#22c55e; border-radius:50%; transform:translate(-50%,-50%);
    box-shadow:0 0 20px #22c55e; animation:pulse 2s infinite;
}
.ripple {
    position:absolute; top:50%; left:50%; width:40px; height:40px;
    border:2px solid #22c55e; border-radius:50%; transform:translate(-50%,-50%);
    animation:ripple 2s infinite;
}

/* COORDINATES - Contained within green circle */
.coords {
    position:absolute;
    top: 65%; 
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    text-align:center;
    font-size:0.85rem;
    color:#22c55e;
    font-family: 'Courier New', Courier, monospace;
    font-weight: bold;
    pointer-events: none; /* Allows the click to go through to the link */
    text-shadow: 0px 0px 4px rgba(0,0,0,0.9);
}

/* ANIMATIONS */
@keyframes spin { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
@keyframes spinReverse { from{transform:rotate(360deg);} to{transform:rotate(0deg);} }
@keyframes pulse { 0%,100%{transform:translate(-50%,-50%) scale(1);} 50%{transform:translate(-50%,-50%) scale(1.3);} }
@keyframes ripple { 0%{opacity:1; transform:translate(-50%,-50%) scale(1);} 100%{opacity:0; transform:translate(-50%,-50%) scale(3);} }

/* SKILLS SECTION */
.section { text-align:center; width: 100%; }
.skills { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:20px; }
.skill { padding:8px 16px; border:1px solid rgba(255,255,255,0.3); border-radius:30px; transition:0.3s; font-size: 0.85rem; }
.skill:hover { background:white; color:black; border-color: white; }
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="main">

    <!-- HERO -->
    <div class="hero">
        <h1>GIS Portfolio</h1>
        <p>Interactive maps, spatial analysis, and data visualization built this semester using modern geospatial tools.</p>
        <a href="portfolio.html" class="btn">Enter Portfolio</a>
    </div>

    <!-- CENTERED GRAPHIC LINK -->
    <div class="circle-container">
        <a href="https://www.latlong.net/" target="_blank" class="graphic-link">
            <div class="circle" id="circle">
                <svg class="outer">
                    <defs>
                        <path id="textPath" d="M130,130 m-100,0 a100,100 0 1,1 200,0 a100,100 0 1,1 -200,0"/>
                    </defs>
                    <text fill="#38bdf8" font-size="13" font-weight="bold" letter-spacing="1.5">
                        <textPath href="#textPath" startOffset="0%">• FIND YOUR LATITUDE || LONGITUDE</textPath>
                        <textPath href="#textPath" startOffset="50%">• FIND YOUR LATITUDE || LONGITUDE</textPath>
                    </text>
                </svg>

                <svg class="inner">
                    <circle cx="130" cy="130" r="60" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="5 5"/>
                </svg>

                <div class="core"></div>
                <div class="ripple"></div>
                <div class="coords" id="coords"></div>
            </div>
        </a>
    </div>

    <!-- SKILLS SECTION -->
    <div class="section">
        <h2>Skills & Tools</h2>
        <div class="skills">
            <div class="skill">Leaflet</div>
            <div class="skill">GeoJSON</div>
            <div class="skill">ArcGIS Pro</div>
            <div class="skill">Spatial Analysis</div>
            <div class="skill">Data Visualization</div>
            <div class="skill">Web Mapping</div>
        </div>
    </div>

</div>

<script>
const circle = document.getElementById("circle");
const coords = document.getElementById("coords");

circle.addEventListener("mousemove", (e)=>{
    const rect = circle.getBoundingClientRect();
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    // Check distance for inner green circle (radius 60)
    const distance = Math.sqrt(Math.pow(mouseX - centerX, 2) + Math.pow(mouseY - centerY, 2));

    // Tilt Effect
    let rotateX = -(mouseY - centerY)/12;
    let rotateY = (mouseX - centerX)/12;
    circle.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

    // Philadelphia Area Simulated Coordinates
    if (distance < 65) {
        let lat = (39.9526 + (centerY - mouseY) / 600).toFixed(4);
        let lon = (-75.1652 + (mouseX - centerX) / 600).toFixed(4);
        coords.innerText = `${lat}, ${lon}`;
    } else {
        coords.innerText = "";
    }
});

circle.addEventListener("mouseleave", ()=>{
    circle.style.transform = "rotateX(0) rotateY(0)";
    coords.innerText = "";
});
</script>

</body>
</html>
