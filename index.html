<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIS Portfolio</title>

<style>
* {margin:0; padding:0; box-sizing:border-box;}

body {
    font-family:'Segoe UI', sans-serif;
    background:black;
    color:white;
    overflow-x:hidden;
}

/* BACKGROUND */
.bg {
    position:fixed;
    width:100%;
    height:100%;
    background:linear-gradient(-45deg,#0ea5e9,#9333ea,#22c55e,#f59e0b);
    background-size:400% 400%;
    animation:gradient 15s ease infinite;
    z-index:-2;
}

@keyframes gradient {
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.overlay {
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.65);
    backdrop-filter:blur(10px);
    z-index:-1;
}

/* MAIN LAYOUT */
.main {
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:80px; 
    padding:40px 20px;
}

/* HERO */
.hero {
    text-align:center;
    z-index: 10;
}

.hero h1 {
    font-size:3.5rem;
}

.hero p {
    max-width:600px;
    margin: 15px auto 30px auto; /* Added margin-bottom for button spacing */
    opacity:0.85;
}

/* BUTTON FIXES */
.btn {
    display: inline-block; /* Essential for padding/margins */
    padding:12px 26px;
    border:2px solid #38bdf8;
    color:#38bdf8;
    text-decoration:none;
    position:relative;
    overflow: hidden; /* This keeps the blue slide INSIDE the button */
    z-index: 1; /* Ensures text stays visible over the slide */
    transition: color 0.4s;
    font-weight: bold;
}

.btn:before {
    content:'';
    position:absolute;
    width:100%;
    height:100%;
    background:#38bdf8;
    top: 0;
    left:-100%;
    transition:0.4s;
    z-index:-1; /* Slides behind the text */
}

.btn:hover:before {left:0;}
.btn:hover {color:black;}

/* CIRCLE */
.circle-container {
    display:flex;
    justify-content:center;
    align-items:center;
}

.circle {
    width:260px;
    height:260px;
    position:relative;
    cursor:crosshair; /* Change cursor to indicate data exploration */
    transition:transform 0.2s ease;
}

/* SVG rings */
svg {
    position:absolute;
    width:100%;
    height:100%;
}

.outer { animation:spin 20s linear infinite; }
.inner { animation:spinReverse 12s linear infinite; }

/* pulse core */
.core {
    position:absolute;
    top:50%;
    left:50%;
    width:30px;
    height:30px;
    background:#22c55e;
    border-radius:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 20px #22c55e;
    animation:pulse 2s infinite;
}

/* ripple */
.ripple {
    position:absolute;
    top:50%;
    left:50%;
    width:40px;
    height:40px;
    border:2px solid #22c55e;
    border-radius:50%;
    transform:translate(-50%,-50%);
    animation:ripple 2s infinite;
}

/* COORD TEXT */
.coords {
    position:absolute;
    bottom:-45px;
    width:100%;
    text-align:center;
    font-size:0.95rem;
    color:#ffffff;
    font-family: monospace;
    text-shadow:0 0 8px rgba(255,255,255,0.8);
    background: rgba(0,0,0,0.3);
    padding: 5px;
    border-radius: 4px;
}

/* ANIMATIONS */
@keyframes spin {
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}
@keyframes spinReverse {
    from{transform:rotate(360deg);}
    to{transform:rotate(0deg);}
}
@keyframes pulse {
    0%,100%{transform:translate(-50%,-50%) scale(1);}
    50%{transform:translate(-50%,-50%) scale(1.4);}
}
@keyframes ripple {
    0%{opacity:1; transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0; transform:translate(-50%,-50%) scale(3);}
}

/* SKILLS */
.section {
    text-align:center;
}

.skills {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    margin-top:15px;
}

.skill {
    padding:8px 16px;
    border:1px solid white;
    border-radius:30px;
    transition:0.3s;
}
.skill:hover {
    background:white;
    color:black;
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="main">

<!-- HERO -->
<div class="hero">
    <h1>GIS Portfolio</h1>
    <p>Interactive maps, spatial analysis, and data visualization built this semester using modern geospatial tools.</p>
    <a href="portfolio.html" class="btn">Enter Portfolio</a>
</div>

<!-- CIRCLE -->
<div class="circle-container">
    <div class="circle" id="circle">
        <svg class="outer">
            <defs>
                <!-- Optimized path for text spacing -->
                <path id="textPath" d="M130,130 m-100,0 a100,100 0 1,1 200,0 a100,100 0 1,1 -200,0"/>
            </defs>
            <text fill="#38bdf8" font-size="13" font-weight="bold" letter-spacing="1">
                <textPath href="#textPath" startOffset="0%">
                    • FIND YOUR LATITUDE || LONGITUDE
                </textPath>
                <textPath href="#textPath" startOffset="50%">
                    • FIND YOUR LATITUDE || LONGITUDE
                </textPath>
            </text>
        </svg>

        <svg class="inner">
            <circle cx="130" cy="130" r="60" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="4 4"/>
        </svg>

        <div class="core"></div>
        <div class="ripple"></div>

        <div class="coords" id="coords">Hover to Scan Coords</div>
    </div>
</div>

<!-- SKILLS -->
<div class="section">
    <h2>Skills & Tools</h2>
    <div class="skills">
        <div class="skill">Leaflet</div>
        <div class="skill">GeoJSON</div>
        <div class="skill">ArcGIS Pro</div>
        <div class="skill">Spatial Analysis</div>
        <div class="skill">Data Visualization</div>
        <div class="skill">Web Mapping</div>
    </div>
</div>

</div>

<script>
const circle = document.getElementById("circle");
const coords = document.getElementById("coords");

/* Tilt & Hover Data Capture */
circle.addEventListener("mousemove", (e)=>{
    const rect = circle.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;

    // Tilt Logic
    let rotateX = -(y - rect.height/2)/10;
    let rotateY = (x - rect.width/2)/10;
    circle.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

    // Coordinate Representation Logic (Maps mouse position to simulated Lat/Long)
    // Maps 0-260px to Lat -90 to 90 and Long -180 to 180
    let simulatedLat = (90 - (y / rect.height) * 180).toFixed(4);
    let simulatedLong = ((x / rect.width) * 360 - 180).toFixed(4);
    
    coords.innerText = `LAT: ${simulatedLat} | LONG: ${simulatedLong}`;
    coords.style.color = "#38bdf8";
});

circle.removeEventListener("click", null); // Ensure clean interaction

circle.addEventListener("mouseleave", ()=>{
    circle.style.transform = "rotateX(0) rotateY(0)";
    coords.innerText = "Hover to Scan Coords";
    coords.style.color = "#ffffff";
});
</script>

</body>
</html>
